[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phx-filters-iso"
dynamic = ["version"]
description = "Extends phx-filters, adding filters for interpreting ISO codes."
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
requires-python = ">=3.12"
readme = "README.rst"
license = "MIT"

# :see: https://pypi.org/classifiers/
keywords = [
    "bcp 47",
    "data validation",
    "i18n",
    "ietf language tags",
    "internationalisation",
    "internationalization",
    "iso",
    "iso-3166",
    "iso-4217",
    "l10n",
    "localisation",
    "localization",
    "standards",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
]

dependencies = [
    "iso3166",
    "language_tags",
    # 4.0 is the first release whose BaseFilter is typed (py.typed, generic
    # over its output type).
    "phx-filters >= 4.0.0a2",
    "py-moneyed",
]

# https://filters.readthedocs.io/en/latest/extensions.html#registering-your-filters
[project.entry-points."filters.extensions"]
Country = "filters_iso:Country"
Currency = "filters_iso:Currency"
Locale = "filters_iso:Locale"

[project.urls]
Repository = "https://github.com/todofixthis/filters-iso"
Documentation = "https://filters.readthedocs.io/"
Changelog = "https://github.com/todofixthis/filters-iso/releases"
Issues = "https://github.com/todofixthis/filters-iso/issues"

[dependency-groups]
# I'm only one person, so to keep from getting overwhelmed, I'm only committing
# to supporting the 3 most recent versions of Python (see
# https://github.com/todofixthis/cookiecutter-py/blob/main/docs/adr/015-propagate-template-changes-with-copier-and-rotate-python-from-agent-sessions.md).
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-mypy>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "tox>=4,<5",
    "tox-uv>=1,<2",
]

# Used by GitHub Actions.
ci = [
    "black>=26,<27",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
    "tox-uv>=1,<2",
]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.mypy",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
]

[tool.black]
# Explicit, because black otherwise infers every version `requires-python`
# allows, including ones newer than the running interpreter can parse.
target-version = [
    "py314",
    "py313",
    "py312",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/filters_iso",
    "LICENCE.txt",
    "test",
]

[tool.hatch.build.targets.wheel]
include = ["src/filters_iso"]

[tool.hatch.build.targets.wheel.sources]
"src/filters_iso" = "filters_iso"

[tool.hatch.version]
path = "src/filters_iso/__init__.py"

[tool.mypy]
strict = true

# phx-filters rejects a value by returning `_invalid_value()`'s result (`Any`,
# `None` by default) from a non-Optional `_apply`. Re-enable both codes once
# todofixthis/filters#121 makes rejection raise instead.
[[tool.mypy.overrides]]
module = ["filters_iso"]
disable_error_code = ["no-any-return", "return-value"]

# language_tags ships no type information.
[[tool.mypy.overrides]]
module = ["language_tags", "language_tags.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff.lint]
# phx-filters' BaseFilter declares `templates` as an instance attribute, so a
# subclass annotating it `ClassVar`, as RUF012 asks, fails mypy's override
# check.
ignore = ["RUF012"]

[tool.tox]
env_list = [
    "py314",
    "py313",
    "py312",
]

[tool.tox.env_run_base]
commands = [
    ["pytest"],
    ["mypy", "src", "test"],
]
runner = "uv-venv-lock-runner"

[tool.uv]
keyring-provider = "subprocess"
# Fix SSL errors when running in Leash containers
system-certs = true
# Resolve only releases at least 3 days old, so a broken or malicious release
# is usually yanked before a lock refresh picks it up (ADR 013 in
# todofixthis/cookiecutter-py). Exempt one package with
# `exclude-newer-package = { <package> = false }`.
exclude-newer = "3 days"
